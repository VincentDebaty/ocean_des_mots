<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>L'Océan des Mots</title>
<meta name="description" content="Jeu d'orthographe : dictée, pendu, anagramme, mémoire flash, bulles et phrases à trous.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Océan des Mots">
<meta name="theme-color" content="#55cddd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<style>
/* Layout: one-screen mobile app over a sunlit lagoon; foam cards float, keyboard docks low like a sandbar */
:root{
  --sea-0:#a6ecf4; --sea-1:#55cddd; --sea-2:#1aa2bf; --sea-3:#0d6e92;
  --deep:#0a3d5c; --lagoon:#13a7bd; --foam:#f4fcfb; --sand:#f7e1b5; --sand-d:#d9b273;
  --coral:#ff7b5f; --sun:#ffc63d; --sun-d:#e09a00; --kelp:#1fae6c; --kelp-d:#13834f;
  --urchin:#e4455e; --ink:#0f3550; --ink-soft:#4f7288; --lilac:#8a63c2;
  --card:rgba(255,255,255,.94); --line:#cfe8ee;
  --shadow:0 5px 0 rgba(10,61,92,.14), 0 12px 28px rgba(10,61,92,.18);
  --f-display:'Grandstander','Chalkboard SE','Marker Felt','Comic Sans MS',system-ui,sans-serif;
  --f-body:'Andika','Avenir Next','Helvetica Neue',system-ui,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  --kh:clamp(36px, 5.8vh, 50px);
  /* extra room above the home indicator when the page sits in a frame that reports no safe area (set by script) */
  --bottom-gap:0px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--sea-1);background-image:linear-gradient(180deg,var(--sea-0) 0%,var(--sea-1) 36%,var(--sea-2) 76%,var(--sea-3) 100%);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

/* ---------- decor ---------- */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rays{position:absolute;left:50%;top:-30vmax;width:220vmax;height:220vmax;margin-left:-110vmax;background:repeating-conic-gradient(from 160deg at 50% 0%,rgba(255,255,255,.18) 0deg 3deg,transparent 3deg 11deg);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 45%);mask-image:linear-gradient(180deg,#000 0%,transparent 45%);animation:sway 16s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.rise{position:absolute;bottom:-40px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7) 0 12%,rgba(255,255,255,.08) 40%);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-115vh)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px 6px}
.brand{display:flex;align-items:center;gap:6px;min-width:0;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(15px,4.3vw,19px);text-shadow:0 2px 0 rgba(10,61,92,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none;width:30px;height:30px}
.pills{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.9);border-radius:999px;padding:5px 10px 5px 6px;font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(10,61,92,.15);font-variant-numeric:tabular-nums}
.pill svg{width:22px;height:22px}
.pill.snd{padding:5px 8px}
.screen{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:6px 24px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.95);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(10,61,92,.18);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:6px 12px;margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:16px;font-family:var(--f-display);font-weight:700;font-size:12.5px;color:var(--ink-soft)}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--deep);background:#dff5f8}
body.in-game .topbar,body.in-game .tabbar{display:none}

/* ---------- common ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sun);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:19px;padding:13px 22px;border-radius:18px;box-shadow:0 5px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-d)}
.btn.big{font-size:22px;padding:16px 28px;width:100%}
.btn.blue{background:var(--lagoon);color:#fff;box-shadow:0 5px 0 #0b7b8c}
.btn.green{background:var(--kelp);color:#fff;box-shadow:0 5px 0 var(--kelp-d)}
.btn.red{background:var(--urchin);color:#fff;box-shadow:0 5px 0 #a82a3f}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-soft);font-size:17px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip:disabled{opacity:.45}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.sec{color:#fff;font-size:21px;text-shadow:0 2px 0 rgba(10,61,92,.25);display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-body);font-size:14px;opacity:.85}
.page-title{color:#fff;font-size:30px;text-shadow:0 3px 0 rgba(10,61,92,.25)}
.small{font-size:13.5px;color:var(--ink-soft)}
.bar{height:12px;border-radius:99px;background:#d6eef2;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--coral));transition:width .6s}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.float-pts{position:fixed;z-index:70;transform:translate(-50%,0);font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--sun);text-shadow:0 2px 0 var(--deep),0 0 10px rgba(255,255,255,.6);pointer-events:none;animation:floatUp 1.1s ease-out forwards}
.float-pts.bad{color:#fff;font-size:20px}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.15)}to{opacity:0;transform:translate(-50%,-60px) scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px) + var(--bottom-gap));transform:translateX(-50%);z-index:80;background:var(--deep);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 40px);text-align:center;box-shadow:var(--shadow)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(6,40,60,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--foam);border-radius:28px 28px 0 0;padding:22px var(--gutter-r) calc(22px + env(safe-area-inset-bottom,0px) + var(--bottom-gap)) var(--gutter-l);display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(60%)}}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:28px;padding:26px}}
.sheet-head{display:flex;align-items:center;gap:14px}
.sheet-head .sh-icon{width:72px;height:72px;flex:none;border-radius:22px;display:grid;place-items:center}
.sheet-head .sh-icon svg{width:56px;height:56px}
.sheet-head h2{font-size:26px}
.sheet-head .sub{color:var(--ink-soft);font-weight:700}
.rules{font-size:17px;line-height:1.5}
.sh-stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sh-stats>div{background:#fff;border-radius:16px;padding:8px 14px;display:flex;flex-direction:column}
.sh-stats .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
.sh-stats b{font-family:var(--f-display);font-size:22px}
.warn{background:#fff1d6;border-radius:14px;padding:10px 14px;font-weight:700;color:#8a5a00}
.field-in{width:100%;box-sizing:border-box;border:3px solid var(--line);border-radius:16px;padding:12px 14px;font-size:20px;background:#fff}
.field-in:focus{border-color:var(--lagoon);outline:none}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:12px 16px 12px 8px}
.hero-turtle{width:112px;flex:none}
.hero-turtle svg{width:100%;height:auto;display:block}
.hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero-txt h1{font-size:26px}
.hero-txt .tn{font-weight:700;color:var(--ink-soft)}
.daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:24px;padding:14px 16px;background:linear-gradient(120deg,#ffe08a,#ffb36b);box-shadow:0 5px 0 #d98a3a,0 12px 26px rgba(10,61,92,.18)}
.daily .d-ico{width:54px;height:54px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center}
.daily .d-ico svg{width:40px;height:40px}
.daily h3{font-size:21px}
.daily p{font-size:14px;font-weight:700;color:#7a4a12}
.daily .x2{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:20px;background:#fff;border-radius:12px;padding:4px 10px;color:var(--coral);flex:none}
.daily.done{background:linear-gradient(120deg,#d9f7e4,#b6ecd0);box-shadow:0 5px 0 #7cc9a0,0 12px 26px rgba(10,61,92,.14)}
.daily.done p{color:#226a45}
.daily.done .x2{color:var(--kelp)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:620px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border-radius:24px;padding:12px 14px 14px;box-shadow:var(--shadow);transition:transform .1s;min-width:0}
.game-card:active{transform:scale(.97)}
.gc-icon{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;margin-bottom:6px}
.gc-icon svg{width:48px;height:48px}
.gc-name{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.gc-sub{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.gc-rec{margin-top:6px;font-size:14px;color:var(--ink-soft)}
.gc-rec b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.gc-medals{display:flex;gap:4px;margin-top:4px;min-height:22px;flex-wrap:wrap}
.mm{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700}
.mm svg{width:16px;height:20px}
.t-conque .gc-icon,.t-conque .sh-icon{background:#ffe3da}
.t-chateau .gc-icon,.t-chateau .sh-icon{background:#fdf0d2}
.t-coquillages .gc-icon,.t-coquillages .sh-icon{background:#efe4fb}
.t-phare .gc-icon,.t-phare .sh-icon{background:#ffe1dd}
.t-bulles .gc-icon,.t-bulles .sh-icon{background:#d8f5fa}
.t-bouteille .gc-icon,.t-bouteille .sh-icon{background:#dcf5e8}
.empty-card{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-card svg{width:90px}

/* ---------- game screen ---------- */
.screen.game{display:flex;flex-direction:column;overflow:visible;padding:0}
.ghud{display:flex;align-items:center;gap:10px;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:10px 4px}
.round-btn{width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;font-weight:700;box-shadow:0 3px 0 rgba(10,61,92,.15)}
.dots{flex:1;display:flex;gap:5px;justify-content:center;min-width:0}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.6);flex:0 1 14px}
.dots i.full{background:var(--sun);border-color:#fff}
.dots i.part{background:#dfe8ee;border-color:#fff}
.dots i.zero{background:var(--urchin);border-color:#fff;opacity:.75}
.dots i.cur{background:#fff;transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.score-pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--f-display);font-weight:800;font-size:19px;box-shadow:0 3px 0 rgba(10,61,92,.15);font-variant-numeric:tabular-nums}
.score-pill svg{width:22px;height:22px}
.gtag{text-align:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px;min-height:4px;text-shadow:0 1px 0 rgba(10,61,92,.3)}
.stage{flex:1;min-height:0;overflow-y:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:8px calc(16px + var(--bottom-gap));display:flex;flex-direction:column;align-items:center;gap:14px}
.stage>*{width:100%;max-width:600px}
.hint{text-align:center;color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 0 rgba(10,61,92,.3)}
#kbdock{flex:none}
.stage:has(+ #kbdock:not([hidden])){padding-bottom:16px}
.kb{display:flex;flex-direction:column;gap:6px;background:rgba(8,55,80,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:22px 22px 0 0;padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px));padding-block:8px calc(14px + var(--bottom-gap) + env(safe-area-inset-bottom,0px));margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px))}
.kb-row{display:flex;gap:5px;justify-content:center;width:100%;max-width:640px;margin:0 auto}
.key{flex:1 1 0;min-width:0;max-width:56px;height:var(--kh);border-radius:10px;background:#fff;box-shadow:0 3px 0 #a9cfdb;font-family:var(--f-body);font-weight:700;font-size:21px;color:var(--ink);display:grid;place-items:center;transition:transform .05s}
.key.acc{background:#fff3cf;box-shadow:0 3px 0 #e0b956}
.key.back{max-width:76px;flex-grow:1.5;font-size:20px;background:#dbeef3}
.key.space{max-width:none;flex:3;font-size:15px;color:var(--ink-soft)}
.key.enter{max-width:none;flex:2;background:var(--kelp);color:#fff;box-shadow:0 3px 0 var(--kelp-d);font-family:var(--f-display);font-size:18px}
.key.down{transform:translateY(3px);box-shadow:0 0 0 transparent}
.key.hit{background:var(--kelp);color:#fff;box-shadow:0 3px 0 var(--kelp-d)}
.key.miss{opacity:.28}

/* slate */
.slate{min-height:66px;box-sizing:border-box;background:#fff;border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:10px 14px;font-family:var(--f-body);font-weight:700;font-size:clamp(26px,7.4vw,40px);letter-spacing:.02em;color:var(--ink);word-break:break-word;text-align:center;border:3px solid transparent}
.slate .ph{color:#a6c3cf;font-size:20px;font-weight:400}
.slate .caret{display:inline-block;width:3px;height:1em;background:var(--lagoon);margin-left:2px;animation:blink 1s steps(1) infinite;vertical-align:-0.1em}
@keyframes blink{50%{opacity:0}}
.slate.ok{border-color:var(--kelp);background:#e6f8ee}
.slate.ok .caret,.slate.ko .caret{display:none}
.slate.ko{border-color:var(--urchin);background:#fdecef}
.fb{display:flex;flex-direction:column;gap:12px;align-items:center}
.fb:empty{display:none}
.fb-good{font-family:var(--f-display);font-weight:800;font-size:28px;color:#fff;text-shadow:0 2px 0 var(--kelp-d)}
.fb-q{font-family:var(--f-display);font-weight:700;font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(10,61,92,.3);text-align:center}
.choices{display:flex;flex-direction:column;gap:10px;width:100%}
.choice{background:#fff;border-radius:18px;padding:14px;font-family:var(--f-body);font-weight:700;font-size:clamp(22px,6vw,30px);box-shadow:0 5px 0 #a9cfdb;transition:transform .08s}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #a9cfdb}
.choice.ok,.choice.reveal{background:var(--kelp);color:#fff;box-shadow:0 5px 0 var(--kelp-d)}
.choice.ko{background:#fbd9df;color:#a32a40;box-shadow:0 5px 0 #eaa9b5;text-decoration:line-through}
.choice:disabled:not(.ok):not(.ko):not(.reveal){opacity:.55}
.correction{width:100%;box-sizing:border-box;background:#fff;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.corr-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.corr-lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);width:92px;flex:none}
.corr-w{font-weight:700;font-size:26px}
.corr-w.good{color:var(--kelp-d)}
mark{background:none;border-radius:4px;padding:0 1px}
mark.bad{color:var(--urchin);text-decoration:underline wavy;text-underline-offset:4px}
mark.fix{background:#c9f2d9;color:var(--kelp-d)}

/* conch */
.conch-prompt{display:flex;flex-direction:column;align-items:center;gap:12px}
.conch{position:relative;width:132px;height:132px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
.conch svg{width:92px;height:92px;transition:transform .2s}
.conch.speaking svg{animation:wob .6s ease-in-out infinite alternate}
.conch.speaking::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid #fff;animation:ring 1s ease-out infinite}
@keyframes wob{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.06)}}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.row-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nospeech{background:#fff;border-radius:16px;padding:10px 14px;text-align:center}

/* lighthouse */
.beacon{position:relative;min-height:180px;border-radius:28px;background:linear-gradient(180deg,#123e63,#1d5f85);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;cursor:pointer}
.beacon .lh{position:absolute;left:10px;bottom:22px;width:54px;height:54px;opacity:.9}
.beacon .beam{position:absolute;left:-30%;top:50%;width:160%;height:180%;margin-top:-90%;background:conic-gradient(from 250deg at 0% 50%,transparent 0deg,rgba(255,240,170,.55) 18deg,transparent 40deg);animation:sweep 3s ease-in-out infinite alternate;pointer-events:none}
@keyframes sweep{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.flash-word{position:relative;font-family:var(--f-body);font-weight:700;font-size:clamp(34px,10vw,56px);color:#fff8d6;text-shadow:0 0 18px rgba(255,230,140,.8);padding:20px;text-align:center;transition:filter .5s,opacity .5s}
.beacon.fog .flash-word{filter:blur(2px);opacity:.75;color:#cfe3ef;text-shadow:none}
.beacon.fog .beam{opacity:.2}
.timer{position:absolute;left:18px;right:18px;bottom:14px;height:8px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sun);border-radius:9px;transform-origin:left;animation:drain linear forwards}
.beacon.fog .timer{display:none}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* castle */
.castle-scene{border-radius:26px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(180deg,#bfefff,#e9fbff 70%)}
.castle-scene svg{display:block;width:100%;height:auto}
#water{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.waveline{animation:wave 3s linear infinite}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
.castle-scene.saved .castle{animation:hop .6s 2}
@keyframes hop{50%{transform:translateY(-10px)}}
.castle{transform-box:fill-box}
.castle-scene.flooded .castle{opacity:.35;transition:opacity 1s}
.castle-info{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lives{display:flex;gap:4px}
.lives i{width:16px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--coral);border:2px solid #fff;box-shadow:0 2px 0 rgba(10,61,92,.2)}
.lives i.lost{background:rgba(255,255,255,.3)}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:.35em .9em;font-family:var(--f-body);font-weight:700;font-size:min(40px, calc((100vw - 56px) / var(--n, 8) / 1.05))}
.wgrp{display:flex;gap:.12em;align-items:flex-end}
.slot{width:.9em;height:1.25em;display:grid;place-items:center;border-bottom:.12em solid #fff;color:#fff;text-shadow:0 2px 0 rgba(10,61,92,.35)}
.slot.on{animation:popin .3s}
.slot.miss{color:#ffd0d8}
.sepc{color:#fff;height:1.25em;display:grid;place-items:center}
@keyframes popin{from{transform:scale(.3)}60%{transform:scale(1.3)}}

/* shells (anagram) */
.ana-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px}
.ana-grp{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;align-items:center}
.aslot{--s:max(34px, min(50px, calc((100vw - 48px) / var(--n, 8) - 4px)));width:var(--s);height:calc(var(--s) * 1.12);border-radius:12px;border:3px dashed rgba(255,255,255,.75);display:grid;place-items:center;font-family:var(--f-body);font-weight:700;font-size:calc(var(--s) * .55);color:var(--ink);background:rgba(255,255,255,.12)}
.aslot.filled{border-style:solid;border-color:#fff;background:#fffaf0}
.aslot.locked{background:var(--kelp);color:#fff;border-color:#fff}
.aslot.wrong{background:#fbd9df;border-color:var(--urchin);animation:shake .4s}
.asep{font-family:var(--f-body);font-weight:700;font-size:28px;color:#fff}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:16px 10px;border-radius:26px;background:linear-gradient(180deg,#f7e1b5,#ecc887);box-shadow:inset 0 -6px 0 rgba(160,110,40,.25),var(--shadow);min-height:70px}
.tile{width:54px;height:58px;border-radius:50% 50% 42% 42%/58% 58% 42% 42%;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.35) 7px 9px),radial-gradient(circle at 50% 20%,#fff6ea,#f5b9a3 70%,#e98f78);box-shadow:0 4px 0 #c46a52;font-family:var(--f-body);font-weight:700;font-size:28px;color:var(--ink);display:grid;place-items:center;transition:transform .1s}
.tile:nth-child(3n+2){background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.35) 7px 9px),radial-gradient(circle at 50% 20%,#fbf5ff,#cdb4ef 70%,#a689d6);box-shadow:0 4px 0 #7d5fb0}
.tile:nth-child(3n){background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.35) 7px 9px),radial-gradient(circle at 50% 20%,#fffbe8,#ffe08a 70%,#f2bd3c);box-shadow:0 4px 0 #c89220}
.tile:active{transform:scale(.9)}

/* bottle */
.bottle-wrap{position:relative;padding:18px 10px 10px}
.parchment{position:relative;background:#fff6dc;border-radius:20px;padding:22px 20px;box-shadow:0 0 0 6px #c7f0dd,0 0 0 9px #2c8a5e,var(--shadow);background-image:repeating-linear-gradient(180deg,transparent 0 34px,rgba(201,164,99,.25) 34px 36px)}
.parchment::before{content:"";position:absolute;top:-26px;left:50%;margin-left:-16px;width:32px;height:22px;border-radius:6px 6px 2px 2px;background:#a8743a;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.sentence{font-family:var(--f-body);font-size:clamp(22px,5.8vw,30px);line-height:1.6;text-align:center;color:#4a3412}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px dashed #b08540;height:1.1em;vertical-align:-0.15em;margin:0 .1em}
.blank.filled{border-bottom:none;min-width:0;height:auto;color:var(--kelp-d);font-weight:700;background:#d6f5e3;border-radius:8px;padding:0 .2em;animation:popin .35s}
.blank.filled.wrong{color:#a32a40;background:#fbd9df}

/* bubbles arcade */
.timebar{margin:4px var(--gutter-r) 0 var(--gutter-l);height:10px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transform-origin:left}
.combo{font-family:var(--f-display);font-weight:800;font-size:20px;color:#fff;background:var(--lilac);border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 #5d3f8f;transition:transform .15s}
.combo.bump{transform:scale(1.35)}
.field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;margin-top:6px}
.seaweed{position:absolute;left:0;right:0;bottom:0;height:90px;pointer-events:none}
.seaweed svg{width:100%;height:100%}
.bubble{position:absolute;left:0;top:0;height:66px;min-width:66px;box-sizing:border-box;padding:0 18px;border-radius:999px;border:2.5px solid rgba(255,255,255,.85);background:radial-gradient(ellipse at 28% 25%,rgba(255,255,255,.9) 0 7%,rgba(255,255,255,.18) 18%,rgba(190,240,250,.14) 55%,rgba(255,255,255,.4) 100%);color:#fff;font-family:var(--f-body);font-weight:700;font-size:21px;white-space:nowrap;text-shadow:0 2px 3px rgba(10,61,92,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;will-change:transform}
.bubble.popped{animation:popped .25s forwards}
@keyframes popped{to{opacity:0;scale:1.5}}
.bubble.trap{background:rgba(228,69,94,.85);border-color:#fff}
.bubble.trap s{font-size:15px;opacity:.85}
.bubble.trap b{font-size:20px}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:90px;color:#fff;text-shadow:0 5px 0 rgba(10,61,92,.3);pointer-events:none}
.count.small{font-size:44px;text-align:center;padding:0 20px}

/* results */
.results{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:560px;margin:0 auto;padding-block:28px calc(16px + var(--bottom-gap))}
.res-medal{width:150px;height:170px;display:grid;place-items:center;animation:medalIn .8s cubic-bezier(.2,1.6,.4,1)}
.res-medal svg{width:120px;height:150px;filter:drop-shadow(0 8px 10px rgba(10,61,92,.3))}
@keyframes medalIn{from{transform:scale(0) rotate(-40deg)}}
.res-medal .nomedal{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.results h1{color:#fff;font-size:38px;text-shadow:0 3px 0 rgba(10,61,92,.3)}
.res-score{font-family:var(--f-display);font-size:24px;color:#fff;font-weight:700}
.res-score b{font-size:54px}
.record-banner{background:var(--coral);color:#fff;font-family:var(--f-display);font-weight:800;font-size:24px;padding:8px 22px;border-radius:16px;box-shadow:0 5px 0 #c2533b;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.res-card{width:100%;box-sizing:border-box;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.res-pearls{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:6px}
.res-pearls svg{width:28px;height:28px}
.x2tag{font-size:14px;background:var(--coral);color:#fff;border-radius:10px;padding:2px 8px}
.nudge{font-weight:700;color:var(--ink-soft)}
.grew{display:flex;align-items:center;gap:12px;text-align:left}
.grew svg{width:96px;height:auto}
.badge-new{display:flex;align-items:center;gap:10px;text-align:left}
.badge-new .b-ico{font-size:34px}
.review{width:100%;text-align:left}
.review h3{font-size:19px;margin-bottom:6px}
.review ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.review li{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.review .rw{font-weight:700;font-size:22px;color:var(--deep);text-decoration:underline dotted;text-underline-offset:4px}
.review .was{font-size:15px;color:var(--ink-soft)}
.res-actions{display:flex;flex-direction:column;gap:6px;width:100%}
.res-actions .btn.ghost{color:#fff;text-shadow:0 1px 0 rgba(10,61,92,.35)}

/* reward scenes: one animated reveal per reward, shown one after the other */
#reward{position:fixed;inset:0;z-index:55;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(25,140,180,.96),rgba(6,40,62,.98) 70%);padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:env(safe-area-inset-top,0px) calc(env(safe-area-inset-bottom,0px) + var(--bottom-gap));animation:fade .25s}
.rw-scene{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#fff;width:100%;max-width:420px}
.rw-art{position:relative;width:240px;height:240px;display:grid;place-items:center}
.rw-scene h2{font-size:36px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);animation:titleIn .5s .6s both}
.rw-scene p{font-size:18px;font-weight:700;opacity:.95;max-width:320px;animation:titleIn .5s .8s both}
@keyframes titleIn{from{opacity:0;transform:scale(.6)}}
.rw-next{max-width:320px;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;pointer-events:none}
#reward.ready .rw-next{opacity:1;transform:none;pointer-events:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow0{from{opacity:0;transform:scale(.2)}}
.rw-rays,.rw-ring{position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(var(--c,#ffd34d) 0 9deg,transparent 9deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 68%);mask-image:radial-gradient(circle,#000 25%,transparent 68%);opacity:.55;animation:grow0 .6s .6s both,spin 10s linear infinite}
.rw-ring{--c:#8fd9a0;animation:grow0 .6s 1s both,spin 6s linear infinite reverse}
.rw-medal{position:relative;width:150px;height:188px;animation:medalDrop 1s cubic-bezier(.25,1.3,.5,1) both}
.rw-medal svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
@keyframes medalDrop{0%{transform:translateY(-90vh) rotateY(0deg)}75%{transform:translateY(0) rotateY(720deg)}100%{transform:translateY(0) rotateY(720deg)}}
.rw-shine{position:absolute;left:19px;top:63px;width:112px;height:112px;border-radius:50%;overflow:hidden;pointer-events:none}
.rw-shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);animation:shine 1.1s 1.1s ease-in-out both}
@keyframes shine{to{left:130%}}
.rw-num{position:relative;font-family:var(--f-display);font-weight:800;font-size:110px;line-height:1;color:var(--sun);text-shadow:0 6px 0 #c2533b,0 0 40px rgba(255,200,60,.7);font-variant-numeric:tabular-nums;animation:grow0 .4s both}
.rw-num.pop{animation:numPop .5s}
@keyframes numPop{40%{transform:scale(1.35)}}
.rw-burst{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,198,61,.6),transparent 65%);animation:breathe 1.2s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.25)}}
.rw-wave{position:absolute;inset:30px;border-radius:50%;border:5px solid rgba(255,255,255,.7);animation:ripple 1.4s ease-out infinite}
@keyframes ripple{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}
.rw-glow{position:absolute;left:20px;top:10px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,180,.85),transparent 62%);animation:grow0 .6s .8s both}
.rw-bowl{position:absolute;left:30px;top:150px;width:180px;height:80px;z-index:1}
.rw-lid{position:absolute;left:30px;top:108px;width:180px;height:60px;z-index:3;transform-origin:4% 90%;animation:lidOpen .6s .3s cubic-bezier(.3,1.4,.5,1) both}
@keyframes lidOpen{to{transform:rotate(-30deg)}}
.rw-badge{position:absolute;left:0;right:0;top:22px;z-index:4;font-size:92px;line-height:1;animation:badgeRise .9s .75s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
@keyframes badgeRise{from{opacity:0;transform:translateY(90px) scale(.2)}}
.rw-old,.rw-new{position:absolute;width:240px}
.rw-old svg,.rw-new svg{width:100%;height:auto;display:block}
.rw-old{animation:wiggleOut 1.15s both}
@keyframes wiggleOut{0%{transform:none}12%{transform:rotate(-5deg)}24%{transform:rotate(5deg)}36%{transform:rotate(-6deg)}48%{transform:rotate(6deg)}60%{transform:rotate(-4deg);filter:brightness(1)}85%{opacity:1;transform:scale(1.08);filter:brightness(2.5)}100%{opacity:0;transform:scale(.5);filter:brightness(4)}}
.rw-new{animation:grow0 .7s 1.15s cubic-bezier(.2,1.6,.4,1) both}
.rw-flash{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 62%);opacity:0;animation:flash .7s 1s both}
@keyframes flash{40%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){#reward *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

/* trophies, album, turtle */
.medal-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.medal-sum>div{background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding:10px 4px}
.medal-sum svg{width:40px;height:50px}
.medal-sum b{font-family:var(--f-display);font-size:24px}
.medal-sum span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
.badge{background:rgba(255,255,255,.55);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.badge .b-ico{font-size:34px;filter:grayscale(1);opacity:.45}
.badge b{font-family:var(--f-display);font-size:16px;line-height:1.1}
.badge small{font-size:13px;color:var(--ink-soft)}
.badge.got{background:var(--card);box-shadow:var(--shadow)}
.badge.got .b-ico{filter:none;opacity:1}
.records{display:flex;flex-direction:column;gap:8px}
.rec-row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow)}
.rec-row .gc-icon{width:46px;height:46px;border-radius:14px;margin:0}
.rec-row .gc-icon svg{width:34px;height:34px}
.rec-row .rn{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:17px}
.rec-row .rb{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wcard{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(10,61,92,.12);display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.wcard .ww{font-weight:700;font-size:19px;word-break:break-word}
.stars{color:var(--sun-d);letter-spacing:1px;font-size:15px}
.stars .off{color:#c8dbe2}
.wcard.lv5{background:linear-gradient(135deg,#fff7d1,#ffe08a);box-shadow:0 4px 0 #e0b956}
.turtle-big{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.turtle-big svg{width:min(280px,80vw);height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.turtle-big h1{color:#fff;font-size:34px;text-shadow:0 3px 0 rgba(10,61,92,.3)}
.turtle-big .st{color:#fff;font-weight:700;font-size:18px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.road>div{background:var(--card);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;box-shadow:0 4px 0 rgba(10,61,92,.12)}
.road svg{width:80px;height:auto}
.road .lock svg{filter:brightness(0) opacity(.18)}
.road b{font-family:var(--f-display);font-size:14px;line-height:1.1}
.road small{font-size:12px;color:var(--ink-soft)}
.road .cur{outline:3px solid var(--sun)}

/* parent */
.gate{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:10px}
.gate p{color:#fff;font-weight:700;font-size:18px}
.pin-dots{display:flex;gap:14px}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid #fff}
.pin-dots i.on{background:#fff}
.pinpad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pinpad button{height:66px;border-radius:20px;background:rgba(255,255,255,.92);font-family:var(--f-display);font-weight:800;font-size:28px;box-shadow:0 4px 0 rgba(10,61,92,.2)}
.pinpad button:active{transform:translateY(3px);box-shadow:none}
.pinpad .nb{visibility:hidden}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:rgba(255,255,255,.35);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-family:var(--f-display);font-weight:700;color:#fff}
.seg button.on{background:#fff;color:var(--deep)}
.pform{display:flex;flex-direction:column;gap:10px}
.pform h3{font-size:20px}
.pform label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.pform input,.pform textarea,.pform select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;background:#fff;box-sizing:border-box;width:100%}
.pform textarea{resize:vertical}
.pform code{background:#eef7f9;border-radius:6px;padding:1px 5px;font-size:13px}
.check{font-size:14px;font-weight:700;min-height:1em}
.check.ok{color:var(--kelp-d)}
.check.no{color:#b06a00}
.plist{display:flex;flex-direction:column;gap:8px}
.plist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plist-head h3{font-size:19px}
.plist-head small{font-family:var(--f-body);font-size:13px;color:var(--ink-soft);font-weight:400}
.pwords{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pwords li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.pw-txt{flex:1;min-width:0}
.pw-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pw-main b{font-size:18px}
.pw-main .ko{font-size:12px;font-weight:700;color:var(--urchin);background:#fdecef;border-radius:8px;padding:1px 6px}
.pw-sent{font-size:14px;color:var(--ink-soft);overflow-wrap:anywhere}
.pw-sent.warn{color:#b06a00}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;background:#eef7f9;font-size:18px}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:#c9dbe1;position:relative;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked{background:var(--kelp)}
.switch input:checked::after{transform:translateX(18px)}
.status-line{display:flex;align-items:center;gap:8px;font-weight:700}
.status-line i{width:10px;height:10px;border-radius:50%;background:var(--kelp)}
.status-line i.local{background:var(--sun-d)}

/* tablets: use the width (iPad landscape and portrait) */
.home-top{display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .wrap{max-width:1040px}
  .home-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:stretch}
  .tabbar{grid-template-columns:repeat(4,minmax(0,170px));justify-content:center;column-gap:28px}
  .kb-row{max-width:860px}
  .key{max-width:74px;font-size:24px}
  .key.back{max-width:96px}
}
@media (min-width:900px) and (orientation:landscape){
  .castle-scene{max-width:min(600px,58vh)}
  .conch{width:112px;height:112px}
  .conch svg{width:78px;height:78px}
  .beacon{min-height:150px}
}
@media (prefers-reduced-motion:reduce){
  .rays,.rise,.waveline,.turtle-big svg,.record-banner{animation:none}
  *{scroll-behavior:auto}
}

async function firebaseDb(code) {

function pickWords(pool, n) {
  const now = Date.now();
  let items = pool.map(w => { const m = mastery(w.id); let wt = Math.pow(6 - (m.lv || 0), 2); if (!m.last) wt *= 1.4; else if (now - m.last < 15 * 60e3) wt *= .35; return { w, wt }; });

    const tot = items.reduce((a, b) => a + b.wt, 0); let r = Math.random() * tot, i = 0;

  else if (pts > 0) { m.ok++; P.stats.fts = 0; }

function checkBadges(medal, gameId) {
  const P = Store.progress, words = activeWords();
  const totalPlays = Object.values(P.games).reduce((a, g) => a + (g.plays || 0), 0);

    record5: P.stats.records >= 5, daily5: P.stats.dailyDone >= 5, turtle6: turtleStage(P.pearls) >= 6
  };
  const fresh = [];

/* =========================================================
   On-screen AZERTY keyboard with accent rows
   ========================================================= */
let KB = null;
const ACCENTS = 'éèêëàâçùûîïôœ';
function makeKeyboard(host, { mode = 'type', onKey, onBack, onEnter }) {
  killKeyboard();
  const rows = [
    ['a', 'z', 'e', 'r', 't', 'y', 'u', 'i', 'o', 'p'],
    ['q', 's', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm'],
    mode === 'type' ? ['w', 'x', 'c', 'v', 'b', 'n', "'", '-', '⌫'] : ['w', 'x', 'c', 'v', 'b', 'n'],
    ['é', 'è', 'ê', 'ë', 'à', 'â'],
    ['ç', 'ù', 'û', 'î', 'ï', 'ô', 'œ']
  ];
  const key = k => `<button type="button" class="key${ACCENTS.includes(k) ? ' acc' : ''}${k === '⌫' ? ' back' : ''}" data-k="${esc(k)}" aria-label="${k === '⌫' ? 'Effacer' : esc(k)}">${esc(k)}</button>`;
  let html = rows.map(r => `<div class="kb-row">${r.map(key).join('')}</div>`).join('');
  if (mode === 'type') html += `<div class="kb-row"><button type="button" class="key space" data-k=" ">espace</button><button type="button" class="key enter" data-k="⏎">Valider</button></div>`;
  host.innerHTML = html; host.className = 'kb'; host.hidden = false;
  const press = k => { if (k === '⌫') onBack && onBack(); else if (k === '⏎') onEnter && onEnter(); else onKey && onKey(k); };
  const pd = e => {
    const b = e.target.closest('.key'); if (!b || b.disabled) return;
    e.preventDefault(); Sfx.tap(); b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110); press(b.dataset.k);
  };
  const kd = e => {
    if (e.metaKey || e.ctrlKey) return;
    if ($('#modal') && !$('#modal').hidden) return;
    let k = e.key;
    if (k === 'Backspace' || k === 'Enter') { if (mode === 'type') { e.preventDefault(); press(k === 'Enter' ? '⏎' : '⌫'); } return; }
    if (k.length !== 1) return;
    k = k.toLowerCase().replace('’', "'");
    if (mode !== 'type' && !isLetter(k)) return;
    if (!/[\p{L}' -]/u.test(k)) return;
    const b = $$('.key', host).find(x => x.dataset.k === k); if (b && b.disabled) return;
    e.preventDefault(); press(k);
  };
  host.addEventListener('pointerdown', pd);
  document.addEventListener('keydown', kd);
  const kb = {
    destroy() { host.removeEventListener('pointerdown', pd); document.removeEventListener('keydown', kd); host.innerHTML = ''; host.hidden = true; if (KB === kb) KB = null; },
    mark(k, cls) { const b = $$('.key', host).find(x => x.dataset.k === k); if (b) { b.classList.add(cls); b.disabled = true; } }
  };
  KB = kb; return kb;
}
function killKeyboard() { if (KB) KB.destroy(); }

/* ---- shared: type the word, then 3 choices on error ---- */
function typingFlow(ctx, { slate, fb }) {
  const target = ctx.word.text; let txt = '';
  const draw = () => { slate.innerHTML = (txt ? `<span>${esc(txt).replace(/ /g, '&nbsp;')}</span>` : '<span class="ph">tape le mot ici</span>') + '<i class="caret"></i>'; };
  slate.hidden = false; draw();
  makeKeyboard(ctx.kb, {
    mode: 'type',
    onKey: k => { if ([...txt].length >= 32) return; if (k === ' ' && (!txt || txt.endsWith(' '))) return; txt += k; draw(); },
    onBack: () => { txt = [...txt].slice(0, -1).join(''); draw(); },
    onEnter: validate
  });
  function validate() {
    if (!txt.trim()) { shake(slate); return; }
    killKeyboard();
    const attempt = txt.trim();
    if (norm(attempt) === norm(target)) {
      slate.classList.add('ok'); Sfx.good(); Fx.at(slate, 18); floatText(slate, '+2');
      fb.innerHTML = `<p class="fb-good">${praise()}</p>`;
      setTimeout(() => ctx.done(2), 1250);
      return;
    }
    slate.classList.add('ko'); Sfx.bad(); shake(slate);
    const opts = shuffle([target, ...distractors(target, 2, { exclude: [attempt], maxHomo: 1 })]);
    fb.innerHTML = `<p class="fb-q">Presque ! Lequel est bien écrit ?</p><div class="choices">${opts.map(o => `<button type="button" class="choice" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    $$('.choice', fb).forEach(b => b.addEventListener('click', () => {
      $$('.choice', fb).forEach(x => x.disabled = true);
      const ok = norm(b.dataset.v) === norm(target);
      if (ok) { b.classList.add('ok'); Sfx.good(); floatText(b, '+1'); Fx.at(b, 10); }
      else { b.classList.add('ko'); Sfx.bad(); const good = $$('.choice', fb).find(x => norm(x.dataset.v) === norm(target)); if (good) good.classList.add('reveal'); }
      Speech.say([target]);
      const d = diffHTML(attempt, target);
      fb.insertAdjacentHTML('beforeend', `<div class="correction"><div class="corr-row"><span class="corr-lbl">Tu as écrit</span><span class="corr-w">${d.a}</span></div><div class="corr-row"><span class="corr-lbl">On écrit</span><span class="corr-w good">${d.b}</span></div></div><button type="button" class="btn blue next">Mot suivant</button>`);
      const nx = $('.next', fb); nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      nx.addEventListener('click', () => ctx.done(ok ? 1 : 0, { attempt }));
    }));
  }
}

/* ---- 2. Le Château de sable (pendu) ---- */
function groupsOf(chars) { const g = [[]]; chars.forEach(c => { if (c === ' ') g.push([]); else g[g.length - 1].push(c); }); return g.filter(x => x.length); }
function roundChateau(ctx) {
  const w = ctx.word.text, chars = [...w], MAX = 7;
  const need = new Set(chars.filter(isLetter)), found = new Set();
  let errors = 0, hint = false, over = false;
  const n = Math.max(...groupsOf(chars).map(g => g.length));
  ctx.el.innerHTML = `<div class="castle-scene" id="scene">${castleSVG()}</div>
    <div class="castle-info"><div class="lives" id="lives" aria-label="Vagues restantes"></div><button type="button" class="chip" id="hint">🔊 Indice (−1 perle)</button></div>
    <div class="slots" id="slots" style="--n:${n}"></div><div class="fb" id="fb"></div>`;
  const slots = $('#slots', ctx.el), scene = $('#scene', ctx.el);
  const drawSlots = reveal => {
    slots.innerHTML = groupsOf(chars).map(g => `<span class="wgrp">${g.map(c => isLetter(c)
      ? `<span class="slot${found.has(c) ? ' on' : ''}${reveal && !found.has(c) ? ' miss' : ''}">${found.has(c) || reveal ? esc(c) : ''}</span>`
      : `<span class="sepc">${esc(c)}</span>`).join('')}</span>`).join('');
  };
  const drawLives = () => { $('#lives', ctx.el).innerHTML = Array.from({ length: MAX }, (_, i) => `<i class="${i < errors ? 'lost' : ''}"></i>`).join(''); };
  const setWater = () => { const v = errors >= MAX ? 150 : (errors / MAX) * 118; $('#water', ctx.el).style.transform = `translateY(${-v}px)`; };
  drawSlots(false); drawLives();
  $('#hint', ctx.el).onclick = e => {
    if (!hint) { hint = true; e.currentTarget.textContent = '🔊 Réécouter'; }
    Speech.say([w]);
  };
  makeKeyboard(ctx.kb, {
    mode: 'pendu',
    onKey: k => {
      if (over) return;
      if (chars.includes(k)) {
        found.add(k); KB.mark(k, 'hit'); Sfx.pop(); drawSlots(false);
        if ([...need].every(c => found.has(c))) win();
      } else {
        errors++; KB.mark(k, 'miss'); Sfx.splash(); setWater(); drawLives(); shake(scene);
        if (errors >= MAX) lose();
      }
    }
  });
  function win() {
    over = true; killKeyboard();
    const pts = Math.max(1, (errors <= 1 ? 3 : errors <= 3 ? 2 : 1) - (hint ? 1 : 0));
    scene.classList.add('saved'); Sfx.good(); Fx.at(slots, 20); floatText(slots, '+' + pts);
    $('#fb', ctx.el).innerHTML = `<p class="fb-good">${errors === 0 ? 'Château intact !' : praise()}</p>`;
    Speech.say([w]);
    setTimeout(() => ctx.done(pts), 1700);
  }
  function lose() {
    over = true; killKeyboard(); drawSlots(true); scene.classList.add('flooded'); Sfx.bad();
    Speech.say([w]);
    $('#fb', ctx.el).innerHTML = `<p class="fb-q">La marée a gagné ! Le mot était « ${esc(w)} ».</p><button type="button" class="btn blue next">Mot suivant</button>`;
    $('.next', ctx.el).onclick = () => ctx.done(0);
  }
}

/* ---- 3. Les Coquillages (anagramme) ---- */
function roundCoquillages(ctx) {
  const w = ctx.word.text, chars = [...w];
  const pos = chars.map((c, i) => isLetter(c) ? i : -1).filter(i => i >= 0);
  const target = pos.map(i => chars[i]);
  const tiles = target.map((c, id) => ({ c, id }));
  let order = shuffle(tiles), guard = 0;
  while (order.map(t => t.c).join('') === target.join('') && guard++ < 12 && new Set(target).size > 1) order = shuffle(tiles);
  const placed = new Array(target.length).fill(null), locked = new Set();
  // The first letter of each word starts already in place
  { let k = 0; chars.forEach((c, i) => { if (!isLetter(c)) return; if (i === 0 || chars[i - 1] === ' ') { const t = tiles.find(t => t.c === c && !placed.includes(t.id)); placed[k] = t.id; locked.add(k); } k++; }); }
  let attempts = 0, hint = false, over = false;
  const n = Math.max(...groupsOf(chars).map(g => g.filter(isLetter).length));
  ctx.el.innerHTML = `<p class="hint">Remets les lettres dans l'ordre ! ${groupsOf(chars).length > 1 ? 'Le début de chaque mot est déjà placé.' : 'La première lettre est déjà placée.'}</p><div class="ana-slots" id="aslots" style="--n:${n}"></div>
    <div class="tray" id="tray"></div>
    <div class="row-chips"><button type="button" class="chip" id="listen">🔊 Écouter le mot</button><button type="button" class="chip" id="hint">💡 Une lettre (−1)</button><button type="button" class="chip" id="skip">Je passe</button></div>
    <div class="fb" id="fb"></div>`;
  const aslots = $('#aslots', ctx.el), tray = $('#tray', ctx.el);
  const render = (wrong = new Set()) => {
    let k = 0;
    aslots.innerHTML = groupsOf(chars).map(g => `<span class="ana-grp">${g.map(c => {
      if (!isLetter(c)) return `<span class="asep">${esc(c)}</span>`;
      const s = k++, t = placed[s];
      const cls = locked.has(s) ? ' filled locked' : t != null ? ' filled' : '';
      return `<button type="button" class="aslot${cls}${wrong.has(s) ? ' wrong' : ''}" data-s="${s}" aria-label="Case ${s + 1}">${t != null ? esc(tiles[t].c) : ''}</button>`;
    }).join('')}</span>`).join('');
    const used = new Set(placed.filter(x => x != null));
    tray.innerHTML = order.filter(t => !used.has(t.id)).map(t => `<button type="button" class="tile" data-t="${t.id}">${esc(t.c)}</button>`).join('');
  };
  render();
  tray.addEventListener('click', e => {
    const b = e.target.closest('.tile'); if (!b || over) return;
    const s = placed.findIndex((x, i) => x == null && !locked.has(i)); if (s < 0) return;
    placed[s] = +b.dataset.t; Sfx.tap(); render();
    if (placed.every(x => x != null)) check();
  });
  aslots.addEventListener('click', e => {
    const b = e.target.closest('.aslot'); if (!b || over) return;
    const s = +b.dataset.s; if (locked.has(s) || placed[s] == null) return;
    placed[s] = null; Sfx.tap(); render();
  });
  $('#listen', ctx.el).onclick = () => Speech.say([w]);
  $('#hint', ctx.el).onclick = () => {
    if (over) return;
    const s = target.findIndex((c, i) => !locked.has(i)); if (s < 0) return;
    hint = true;
    const cur = placed[s];
    if (cur != null && tiles[cur].c === target[s]) { locked.add(s); }
    else {
      if (cur != null) placed[s] = null;
      let tid = order.find(t => t.c === target[s] && !placed.includes(t.id))?.id;
      if (tid == null) { const j = placed.findIndex((x, i) => x != null && !locked.has(i) && tiles[x].c === target[s]); tid = placed[j]; placed[j] = null; }
      placed[s] = tid; locked.add(s);
    }
    Sfx.pop(); render();
    if (placed.every(x => x != null)) check();
  };
  $('#skip', ctx.el).onclick = () => { if (over) return; finish(0); };
  function check() {
    const guess = placed.map(t => tiles[t].c);
    if (guess.join('') === target.join('')) return finish(attempts === 0 && !hint ? 2 : 1);
    attempts++; Sfx.bad();
    const wrong = new Set();
    guess.forEach((c, i) => { if (c === target[i]) { if (!locked.has(i)) locked.add(i); } else wrong.add(i); });
    render(wrong);
    setTimeout(() => { wrong.forEach(i => placed[i] = null); if (!over) render(); }, 750);
  }
  function finish(pts) {
    over = true;
    target.forEach((c, i) => { locked.add(i); placed[i] = order.find(t => t.c === c && !placed.slice(0, i).includes(t.id))?.id ?? placed[i]; });
    render();
    $$('.chip', ctx.el).forEach(c => c.disabled = true);
    Speech.say([w]);
    if (pts) {
      Sfx.good(); Fx.at(aslots, 20); floatText(aslots, '+' + pts);
      $('#fb', ctx.el).innerHTML = `<p class="fb-good">${praise()}</p>`;
      setTimeout(() => ctx.done(pts), 1500);
    } else {
      $('#fb', ctx.el).innerHTML = `<p class="fb-q">Le mot était « ${esc(w)} ».</p><button type="button" class="btn blue next">Mot suivant</button>`;
      $('.next', ctx.el).onclick = () => ctx.done(0);
    }
  }
}

   Session runner (10 words) and results

let S = null;
function startSession(gameId, daily = false) {
  const pool = activeWords().filter(w => daily ? DAILY_GAMES.some(g => GAMES[g].eligible(w)) : GAMES[gameId].eligible(w));
  if (!pool.length) { toast("Il n'y a pas encore de mot pour ce jeu."); return; }
  const words = pickWords(pool, Math.min(daily ? 10 : (GAMES[gameId].rounds || 10), pool.length));
  const rounds = words.map(w => ({ w, g: daily ? pick(DAILY_GAMES.filter(g => GAMES[g].eligible(w))) : gameId }));
  S = { id: daily ? 'daily' : gameId, daily, rounds, i: 0, score: 0, max: rounds.reduce((a, r) => a + GAMES[r.g].max, 0), res: [], token: {} };
  go('game');
  screenEl.innerHTML = `<div class="ghud"><button type="button" class="round-btn" id="quit" aria-label="Quitter la partie">✕</button><div class="dots" id="dots"></div><div class="score-pill">${PEARL}<b id="sc">0</b></div></div>
    <div class="gtag" id="gtag"></div><div class="stage" id="stage"></div><div id="kbdock" hidden></div>`;
  $('#quit').onclick = confirmQuit;
  nextRound();
}
function drawHud() {
  if (!S || S.arcade) return;
  $('#dots').innerHTML = S.rounds.map((r, i) => {
    const x = S.res[i]; const cls = x ? (x.pts >= x.max ? 'full' : x.pts > 0 ? 'part' : 'zero') : i === S.i ? 'cur' : '';
    return `<i class="${cls}"></i>`;
  }).join('');
  $('#sc').textContent = S.score;
  const r = S.rounds[S.i];
  $('#gtag').textContent = r ? (S.daily ? `Défi du jour · ${GAMES[r.g].name}` : `Mot ${S.i + 1} sur ${S.rounds.length}`) : '';
}
function nextRound() {
  if (!S) return;
  if (S.i >= S.rounds.length) return endSession();
  const r = S.rounds[S.i], token = S.token = {};
  drawHud();
  const stage = $('#stage'); stage.scrollTop = 0; stage.className = 'stage g-' + r.g;
  GAMES[r.g].round({
    word: r.w, el: stage, kb: $('#kbdock'),
    alive: () => S && S.token === token,
    done: (pts, extra = {}) => {
      if (!S || S.token !== token) return;
      S.token = {}; killKeyboard();
      S.score += pts; S.res.push({ w: r.w, g: r.g, pts, max: GAMES[r.g].max, attempt: extra.attempt });
      updateMastery(r.w, pts, GAMES[r.g].max);
      S.i++; drawHud();
      setTimeout(nextRound, 250);
    }
  });
}
function confirmQuit() {
  modal(`<h2>Quitter la partie ?</h2><p class="rules">Les perles de cette partie ne seront pas gagnées.</p><button type="button" class="btn big" data-close>Je continue</button><button type="button" class="btn ghost" id="doQuit">Quitter</button>`);
  $('#doQuit').onclick = () => { closeModal(); S = null; killKeyboard(); Speech.stop(); go('home'); };
}
function medalFor(pct) { return pct >= 1 ? 'diamant' : pct >= .9 ? 'or' : pct >= .75 ? 'argent' : pct >= .5 ? 'bronze' : null; }
const MEDAL_PCT = { bronze: .5, argent: .75, or: .9, diamant: 1 };
function endSession() {
  const s = S; const pct = s.score / s.max, medal = medalFor(pct);
  const nextM = MEDALS.find(k => MEDAL_PCT[k] > pct);
  const needed = nextM ? Math.ceil(MEDAL_PCT[nextM] * s.max - 1e-9) - s.score : 0;
  finishGame({ id: s.id, name: s.daily ? 'Défi du jour' : GAMES[s.id].name, score: s.score, max: s.max, medal, pearls: s.score, daily: s.daily,
    nextMedal: nextM && needed > 0 ? { k: nextM, needed } : null,
    review: s.res.filter(x => x.pts < x.max).map(x => ({ text: x.w.text, attempt: x.attempt && norm(x.attempt) !== norm(x.w.text) ? x.attempt : null })) });
}
function finishGame({ id, name, score, max, medal, pearls, daily = false, review = [], maxMult = 0, nextMedal = null }) {
  const P = Store.progress, gs = gameStat(id);
  const prevBest = gs.best, isRecord = score > 0 && score > prevBest;
  gs.plays++; if (medal) gs.medals[medal] = (gs.medals[medal] || 0) + 1;
  if (isRecord) { if (prevBest > 0) P.stats.records++; gs.best = score; }
  let doubled = false;
  if (daily && P.daily.date !== today()) { pearls *= 2; doubled = true; P.daily.date = today(); P.stats.dailyDone++; }
  const s0 = turtleStage(P.pearls); P.pearls += pearls; const s1 = turtleStage(P.pearls);
  const t = today();
  if (P.streak.last !== t) { P.streak.count = P.streak.last === yesterday() ? P.streak.count + 1 : 1; P.streak.last = t; P.streak.best = Math.max(P.streak.best, P.streak.count); }
  if (GAME_IDS.includes(id) && !P.stats.played.includes(id)) P.stats.played.push(id);
  if (maxMult > P.stats.combo) P.stats.combo = maxMult;
  const fresh = checkBadges(medal, id);
  Store.saveProgress();
  S = null; killKeyboard();
  showResults({ id, name, score, max, medal, pearls, doubled, prevBest, isRecord, grew: s1 > s0 ? s1 : 0, grewFrom: s0, fresh, review, nextMedal, daily });
}
const TITLES = { diamant: 'Parfait !', or: 'Magnifique !', argent: 'Très bien !', bronze: 'Bien joué !' };

    ${r.fresh.map(b => `<div class="res-card"><div class="badge-new"><span class="b-ico">${b.icon}</span><div><b>Nouveau badge : ${esc(b.name)}</b><br><span class="small">${esc(b.desc)}</span></div></div></div>`).join('')}
    ${uniq.length ? `<div class="res-card review"><h3>Les mots à retenir</h3><ul>${uniq.map(x => `<li><button type="button" class="rw" data-say="${esc(x.text)}">${esc(x.text)}</button>${x.attempt ? `<span class="was">tu as écrit ${diffHTML(x.attempt, x.text).a}</span>` : ''}</li>`).join('')}</ul></div>` : ''}
    <div class="res-actions"><button type="button" class="btn big" data-replay="${r.id}">Rejouer</button><button type="button" class="btn ghost" data-go="home">Retour à la plage</button></div>

function rewardFx(x, ov) {

   5. Les Bulles (arcade)
   ========================================================= */
function startBulles() {
  const pool = activeWords(); if (!pool.length) { toast("Il n'y a pas encore de mot."); return; }
  go('game');
  const token = {}; S = { id: 'bulles', arcade: true, token };
  screenEl.innerHTML = `<div class="ghud"><button type="button" class="round-btn" id="quit" aria-label="Quitter la partie">✕</button><div class="lives" id="lives" style="flex:1;justify-content:center"></div><div class="combo" id="combo">×1</div><div class="score-pill">${PEARL}<b id="sc">0</b></div></div>
    <div class="timebar"><i id="tb"></i></div>
    <div class="field" id="field"><div class="seaweed">${SEAWEED}</div><div class="count" id="count"></div></div>`;
  $('#quit').onclick = () => { st.paused = true; confirmQuit(); const m = $('#modal'); const obs = new MutationObserver(() => { if (m.hidden) { obs.disconnect(); st.paused = false; st.last = 0; } }); obs.observe(m, { attributes: true }); };
  const field = $('#field');
  const allTexts = Store.words.map(x => x.text);
  const st = { score: 0, lives: 3, combo: 0, mult: 1, maxMult: 1, t: 0, dur: 60, list: [], spawnIn: 0, traps: [], paused: false, last: 0, over: false };
  const alive = () => S && S.token === token && !st.over;
  const drawLives = () => { $('#lives').innerHTML = [0, 1, 2].map(i => `<i class="${i >= st.lives ? 'lost' : ''}" style="width:22px;height:22px"></i>`).join(''); };
  const setCombo = () => { const c = $('#combo'); c.textContent = '×' + st.mult; c.classList.add('bump'); setTimeout(() => c.classList.remove('bump'), 150); };
  drawLives();
  const spawn = () => {
    const W = field.clientWidth, H = field.clientHeight, prog = st.t / st.dur;
    const w = pick(pool); let good = Math.random() < .55; let text = w.text;
    if (!good) { text = distractors(w.text, 1, { homo: false, exclude: allTexts })[0]; if (!text) { good = true; text = w.text; } }
    const el = document.createElement('button'); el.type = 'button'; el.className = 'bubble'; el.textContent = text;
    field.appendChild(el);
    const bw = Math.min(el.offsetWidth, W - 8);
    const b = { el, good, text, word: w.text, x0: 4 + Math.random() * Math.max(1, W - bw - 8), y: H + 10, v: H / (8.6 - 3.6 * prog), f: .8 + Math.random(), ph: Math.random() * 6, done: false, h: 66 };
    b.x = b.x0; el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`;
    el._b = b; st.list.push(b);
  };
  const remove = b => { b.el.remove(); st.list = st.list.filter(x => x !== b); };
  field.addEventListener('pointerdown', e => {
    const el = e.target.closest('.bubble'); if (!el || !alive() || st.paused) return;
    e.preventDefault(); const b = el._b; if (b.done) return; b.done = true;
    if (b.good) {
      st.combo++; const m = Math.min(5, 1 + Math.floor(st.combo / 4)); if (m !== st.mult) { st.mult = m; setCombo(); }
      st.maxMult = Math.max(st.maxMult, st.mult);
      const pts = 10 * st.mult; st.score += pts; $('#sc').textContent = st.score;
      Sfx.pop(); Fx.at(el, 12); floatText(el, '+' + pts); el.classList.add('popped'); setTimeout(() => remove(b), 260);
    } else {
      st.lives--; st.combo = 0; if (st.mult !== 1) { st.mult = 1; setCombo(); }
      Sfx.bad(); el.classList.add('trap'); el.innerHTML = `<s>${esc(b.text)}</s><b>${esc(b.word)}</b>`;
      b.v *= .25; st.traps.push(b.word); drawLives(); shake(el);
      setTimeout(() => { el.classList.add('popped'); setTimeout(() => remove(b), 260); }, 1300);
      if (st.lives <= 0) setTimeout(end, 900);
    }
  });
  const loop = ts => {
    if (!alive()) return;
    if (!st.last) st.last = ts;
    const dt = Math.min(.05, (ts - st.last) / 1000); st.last = ts;
    if (!st.paused && !document.hidden) {
      st.t += dt; const prog = Math.min(1, st.t / st.dur);
      st.spawnIn -= dt; if (st.spawnIn <= 0) { spawn(); st.spawnIn = 1.35 - .62 * prog; }
      for (const b of [...st.list]) {
        b.y -= b.v * dt; b.x = b.x0 + Math.sin(st.t * b.f + b.ph) * 10;
        b.el.style.transform = `translate3d(${b.x}px,${b.y}px,0)`;
        if (b.y < -b.h - 10) { if (b.good && !b.done) { st.combo = 0; if (st.mult !== 1) { st.mult = 1; setCombo(); } } remove(b); }
      }
      $('#tb').style.transform = `scaleX(${1 - prog})`;
      if (st.t >= st.dur) return end();
    }
    requestAnimationFrame(loop);
  };
  function end() {
    if (st.over) return; st.over = true;
    st.list.forEach(b => b.el.remove()); st.list = [];
    const th = GAMES.bulles.thresholds; let medal = null; MEDALS.forEach((k, i) => { if (st.score >= th[i]) medal = k; });
    const ni = medal ? MEDALS.indexOf(medal) + 1 : 0;
    const nextMedal = ni < 4 ? { k: MEDALS[ni], needed: th[ni] - st.score } : null;
    $('#count').className = 'count small'; $('#count').textContent = st.lives <= 0 ? 'Plus de vies !' : 'Temps écoulé !';
    setTimeout(() => finishGame({ id: 'bulles', name: 'Les Bulles', score: st.score, max: 0, medal, pearls: Math.round(st.score / 10), maxMult: st.maxMult, nextMedal, review: st.traps.map(t => ({ text: t, attempt: null })) }), 1100);
  }
  (async () => {
    const c = $('#count');
    c.className = 'count small'; c.textContent = 'Éclate les mots bien écrits !'; await sleep(1500);
    c.className = 'count';
    for (const n of ['3', '2', '1']) { if (!alive()) return; c.textContent = n; Sfx.tap(); await sleep(650); }
    if (!alive()) return;
    c.textContent = ''; Sfx.good();
    requestAnimationFrame(loop);
  })();
}

  renderParentBody();
}
function renderGate() {
  const has = !!Store.settings.pin;
  const msg = has ? 'Entre le code parent' : pinFirst ? 'Confirme le code' : 'Choisis un code parent à 4 chiffres';
  screenEl.innerHTML = `<div class="wrap gate">
    <h1 class="page-title">Espace parents</h1><p id="pinMsg">${msg}</p>
    <div class="pin-dots">${[0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="pinpad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => `<button type="button" class="${k ? '' : 'nb'}" data-pin="${k}" aria-label="${k === '⌫' ? 'Effacer' : k}">${k}</button>`).join('')}</div>
    ${has ? '' : '<p class="small" style="color:#fff">Ce code protège la liste de mots et les réglages.</p>'}
  </div>`;
}
function pinPress(k) {
  if (k === '⌫') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  if (pinBuf.length === 4) {
    const has = !!Store.settings.pin;
    if (has) {
      if (pinBuf === Store.settings.pin) { parentOK = true; pinBuf = ''; renderParent(); return; }
      pinBuf = ''; renderGate(); shake($('.pin-dots')); $('#pinMsg').textContent = 'Ce n\'est pas le bon code'; return;
    }
    if (!pinFirst) { pinFirst = pinBuf; pinBuf = ''; renderGate(); return; }
    if (pinBuf === pinFirst) { Store.settings.pin = pinBuf; Store.saveSettings(); pinFirst = ''; pinBuf = ''; parentOK = true; renderParent(); toast('Code parent enregistré'); return; }
    pinFirst = ''; pinBuf = ''; renderGate(); shake($('.pin-dots')); $('#pinMsg').textContent = 'Les deux codes sont différents, recommence'; return;
  }
  renderGate();
}

function parentAddHTML() {

function liveCheck(wEl, sEl, out) {
  const f = () => { const w = wEl.value.trim(), s = sEl.value.trim(); if (!w || !s) { out.textContent = ''; out.className = 'check'; return; } const ok = wordRe(w).test(s); out.textContent = ok ? 'La phrase contient bien le mot.' : 'La phrase ne contient pas le mot tel quel : la Bouteille à la mer ne pourra pas l\'utiliser.'; out.className = 'check ' + (ok ? 'ok' : 'no'); };
  wEl.addEventListener('input', f); sEl.addEventListener('input', f); f();
}
function bindAdd() {
  liveCheck($('#f-word'), $('#f-sent'), $('#f-check'));
  $('#addOne').onsubmit = async e => {
    e.preventDefault(); const text = $('#f-word').value, sentence = $('#f-sent').value, list = $('#f-list').value;
    if (!norm(text)) return;
    if (Store.words.some(w => norm(w.text) === norm(text))) { toast('Ce mot est déjà dans une liste.'); return; }
    lastList = list.trim();
    try { await Store.addWord({ text, sentence, list }); toast(`« ${norm(text)} » ajouté`); $('#f-word').value = ''; $('#f-sent').value = ''; $('#f-check').textContent = ''; $('#f-word').focus(); }
    catch (err) { toast("Le mot n'a pas pu être ajouté. Réessaie."); }
  };
  $('#addMany').onsubmit = async e => {
    e.preventDefault(); const list = $('#f-blist').value; lastList = list.trim();
    const have = new Set(Store.words.map(w => norm(w.text)));
    const lines = $('#f-bulk').value.split(/\n/).map(l => l.trim()).filter(Boolean);
    let added = 0, skipped = 0;
    for (const l of lines) {
      const [t, ...rest] = l.split(/\s*[|\t]\s*/); const text = norm(t);
      if (!text || have.has(text)) { skipped++; continue; }
      try { await Store.addWord({ text, sentence: rest.join(' '), list }); have.add(text); added++; } catch (err) { skipped++; }
    }
    $('#f-bulk').value = '';
    toast(`${added} mot${added > 1 ? 's' : ''} ajouté${added > 1 ? 's' : ''}${skipped ? `, ${skipped} ignoré${skipped > 1 ? 's' : ''} (déjà présents ou vides)` : ''}`);
  };
}

document.addEventListener('click', e => {

  const g = t.closest('[data-go]'); if (g) { if (g.dataset.go === 'parent') { pinBuf = ''; pinFirst = ''; } go(g.dataset.go); screenEl.scrollTop = 0; return; }

  if (t.closest('[data-daily]')) { openDaily(); return; }
  const sy = t.closest('[data-say]'); if (sy) { unlockAudio(); Speech.say([sy.dataset.say]); return; }
  const rp = t.closest('[data-replay]'); if (rp) { unlockAudio(); const id = rp.dataset.replay; id === 'daily' ? startSession(null, true) : id === 'bulles' ? startBulles() : startSession(id); return; }
  const pn = t.closest('[data-pin]'); if (pn && pn.dataset.pin) { pinPress(pn.dataset.pin); return; }
  const pt = t.closest('[data-ptab]'); if (pt) { parentTab = pt.dataset.ptab; renderParent(); return; }
  const ps = t.closest('[data-psort]'); if (ps) { parentSort = ps.dataset.psort; renderParentBody(); return; }
  const ed = t.closest('[data-edit]'); if (ed) { editWord(ed.dataset.edit); return; }
});

  $('#brand').innerHTML = `${turtleSVG(2)}<span>L'Océan des Mots</span>`;
  $('#pearlIco').innerHTML = PEARL; $('#sunIco').innerHTML = SUN;
  if (REDUCED) return;
  $('#risers').innerHTML = Array.from({ length: 9 }, () => { const s = 6 + rnd(16); return `<span class="rise" style="left:${rnd(100)}%;width:${s}px;height:${s}px;animation-duration:${9 + rnd(12)}s;animation-delay:-${rnd(20)}s"></span>`; }).join('');
}
function measureBottomGap() {
  // Inside some frames (claude.ai saved to the iPhone home screen) the page touches the rounded bottom corners
  // and the home indicator, yet env(safe-area-inset-bottom) reads 0 there. Reserve the room ourselves.
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:0;padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const env = probe.getBoundingClientRect().height; probe.remove();
  const rootPad = parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0;
  const touch = matchMedia('(pointer: coarse)').matches;
  const roundedPhone = Math.max(screen.width, screen.height) >= 800;
  const gap = touch && roundedPhone && env < 1 && rootPad < 1 ? 34 : 0;
  document.documentElement.style.setProperty('--bottom-gap', gap + 'px');
}
decorate(); measureBottomGap(); Fx.init(); Speech.init(); go('home');
Store.init();
</script>
